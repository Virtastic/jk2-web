name: release

# Runs on the Virtastic OVH runner (same box as the deploy). Tag pushes come from maintainers,
# so there is no untrusted-input concern here.
#
# MANUAL STEP: the free demo pak is not in this repo and cannot be produced here. Once the
# release exists, attach it:
#   gh release upload <tag> -R Virtastic/jk2-web "<path>/jk2-demo-assets0.pk3#Free Jedi Outcast demo pak (place at demo/assets0.pk3)"
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re-)build the release for
        required: true

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: [self-hosted, ovh, virtastic]
    timeout-minutes: 60
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: Corresponding source archive (the GPLv2 offer)
        run: |
          git archive --format=tar.gz --prefix=jk2-web-${TAG}/ -o jk2-web-src-${TAG}.tar.gz ${TAG}
          ls -la jk2-web-src-${TAG}.tar.gz

      - name: Build the engine in the pinned toolchain
        run: |
          docker run --rm -v "$PWD":/w -w /w alpine:3 rm -rf build-jk2
          docker run --rm -v "$PWD":/src -w /src emscripten/emsdk:6.0.1 sh -c '
            bash shared/wasm-build/build-jk2.sh &&
            bash shared/wasm-build/build-jk2-modules.sh'
          test ! -s build-jk2/build.errs
          test ! -s build-jk2/modules/build.errs
          test "$(stat -c%s play/jk2/qagame.wasm)" -gt 262144

      - name: Stage the runnable bundle
        run: |
          rm -rf bundle && mkdir -p bundle
          cp play/jk2/index.html play/jk2/launcher.html bundle/
          cp play/jk2/jk2.js play/jk2/jk2.wasm play/jk2/qagame.wasm bundle/
          cp shared/web/server.py bundle/
          cp infra/nginx.conf bundle/
          cp README.md SELF_HOSTING.md LICENSE NOTICE.md THIRD-PARTY-LICENSES.md bundle/
          (cd bundle && zip -qr ../jk2-web-${TAG}.zip .)
          ls -la jk2-web-${TAG}.zip

      - name: Publish the container image
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          DOCKER_BUILDKIT=1 docker build --target runtime             -t ghcr.io/virtastic/jk2-web:${TAG} -t ghcr.io/virtastic/jk2-web:latest .
          docker push ghcr.io/virtastic/jk2-web:${TAG}
          docker push ghcr.io/virtastic/jk2-web:latest

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            jk2-web-src-*.tar.gz
            jk2-web-*.zip

      - name: Tidy
        if: always()
        run: docker run --rm -v "$PWD":/w -w /w alpine:3 rm -rf build-jk2 bundle jk2-web-src-*.tar.gz jk2-web-*.zip
