name: release

# Cuts a GitHub Release for a v* tag: the corresponding-source archive (the GPLv2 offer), a
# prebuilt bundle a self-hoster can unzip and serve, and a container image.
#
# MANUAL STEP: the free demo pak is not in this repo and cannot be produced here. After the
# release exists, attach it once:
#   gh release upload <tag> -R Virtastic/jk2-web "<path>/jk2-demo-assets0.pk3#Free Jedi Outcast demo pak (place at demo/assets0.pk3)"
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re-)build the release for
        required: true

permissions:
  contents: write
  packages: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ github.event.inputs.tag || github.ref_name }}', fetch-depth: 0 }
      - name: Corresponding source archive
        run: |
          git archive --format=tar.gz --prefix=jk2-web-${TAG}/ -o jk2-web-src-${TAG}.tar.gz ${TAG}
          ls -la jk2-web-src-${TAG}.tar.gz
      - uses: actions/upload-artifact@v4
        with: { name: source, path: 'jk2-web-src-*.tar.gz' }

  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ github.event.inputs.tag || github.ref_name }}' }
      - name: Build engine in the pinned toolchain
        run: |
          docker run --rm -v "$PWD":/src -w /src emscripten/emsdk:6.0.1 sh -c '
            bash shared/wasm-build/build-jk2.sh &&
            bash shared/wasm-build/build-jk2-modules.sh &&
            test ! -s build-jk2/build.errs && test ! -s build-jk2/modules/build.errs'
          ls -la play/jk2/jk2.js play/jk2/jk2.wasm play/jk2/qagame.wasm
      - name: Stage the runnable bundle
        run: |
          mkdir -p bundle
          cp play/jk2/index.html play/jk2/launcher.html bundle/
          cp play/jk2/jk2.js play/jk2/jk2.wasm play/jk2/qagame.wasm bundle/
          cp shared/web/server.py bundle/
          cp infra/nginx.conf bundle/
          cp README.md SELF_HOSTING.md LICENSE NOTICE.md THIRD-PARTY-LICENSES.md bundle/
          cd bundle && zip -qr ../jk2-web-${TAG}.zip . && cd ..
          ls -la jk2-web-${TAG}.zip
      - uses: actions/upload-artifact@v4
        with: { name: bundle, path: 'jk2-web-*.zip' }

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { ref: '${{ github.event.inputs.tag || github.ref_name }}' }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/virtastic/jk2-web:${{ github.event.inputs.tag || github.ref_name }}
            ghcr.io/virtastic/jk2-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: [source, bundle, image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - run: ls -laR dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            dist/source/*.tar.gz
            dist/bundle/*.zip
