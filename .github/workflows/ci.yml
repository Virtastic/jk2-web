name: ci

# Builds the engine from source on a GitHub-hosted runner and asserts the repo stays clean.
# Deliberately NOT on the self-hosted deploy box: this runs for pull requests from forks once
# the repo is public, so it must never touch private infrastructure.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container: emscripten/emsdk:6.0.1
    steps:
      - uses: actions/checkout@v4
      - name: Build engine + game module
        run: |
          bash shared/wasm-build/build-jk2.sh
          bash shared/wasm-build/build-jk2-modules.sh
      - name: No compiler errors
        run: |
          echo "engine errs: $(wc -c < build-jk2/build.errs) bytes"
          echo "module errs: $(wc -c < build-jk2/modules/build.errs) bytes"
          test ! -s build-jk2/build.errs
          test ! -s build-jk2/modules/build.errs
      - name: Artifacts exist and are non-trivial
        run: |
          ls -la play/jk2/jk2.js play/jk2/jk2.wasm play/jk2/qagame.wasm
          # a silent link failure once produced a 375-byte qagame.wasm stub
          test "$(stat -c%s play/jk2/qagame.wasm)" -gt 262144
      - uses: actions/upload-artifact@v4
        with:
          name: engine
          path: |
            play/jk2/jk2.js
            play/jk2/jk2.wasm
            play/jk2/qagame.wasm
          retention-days: 7

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No game data tracked
        run: |
          if git ls-files | grep -E '\.(pk3|sav)$'; then
            echo "FATAL: game data is tracked"; exit 1
          fi
          echo "ok: no .pk3/.sav tracked"
      - name: No internal infrastructure detail
        run: |
          # games/ is Raven's pristine drop and the engineering log quotes historical sessions
          # verbatim; this file necessarily contains the patterns it searches for.
          if git grep -nI -E '192\.168\.[0-9]+\.[0-9]+|jenkins_home/\.ssh/(id_ed25519|jk2-deploy)'                -- . ':!games/' ':!docs/WASM_ADAPTATIONS.md' ':!.github/workflows/ci.yml'; then
            echo "FATAL: internal infrastructure reference reintroduced"; exit 1
          fi
          echo "ok: no lab hosts or key paths"
