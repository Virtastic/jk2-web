name: ci

# Runs on the Virtastic OVH runner — the same box the deploy uses, which already has Docker and
# the pinned toolchain image cached. GitHub-hosted runners are not used here.
#
# SAFETY: once this repo is public, anyone can open a pull request, and a self-hosted runner
# executes whatever that PR contains on our own hardware. The `if` on every job therefore refuses
# pull requests that come from a fork; PRs from branches inside this repo (i.e. from people who
# already have write access) still get full CI, and pushes to main always run.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, ovh, virtastic]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Clean stale build output
        # The workspace persists between runs on a self-hosted runner, so a previous build's
        # artefacts would otherwise make a broken compile look like it succeeded.
        run: |
          docker run --rm -v "$PWD":/w -w /w alpine:3             rm -rf build-jk2 play/jk2/jk2.js play/jk2/jk2.wasm play/jk2/qagame.wasm
      - name: Build engine + game module
        run: |
          docker run --rm -v "$PWD":/src -w /src emscripten/emsdk:6.0.1 sh -c '
            bash shared/wasm-build/build-jk2.sh &&
            bash shared/wasm-build/build-jk2-modules.sh'
      - name: No compiler errors
        run: |
          echo "engine errs: $(wc -c < build-jk2/build.errs) bytes"
          echo "module errs: $(wc -c < build-jk2/modules/build.errs) bytes"
          test ! -s build-jk2/build.errs
          test ! -s build-jk2/modules/build.errs
      - name: Artifacts exist and are non-trivial
        run: |
          ls -la play/jk2/jk2.js play/jk2/jk2.wasm play/jk2/qagame.wasm
          # a silent link failure once produced a 375-byte qagame.wasm stub
          test "$(stat -c%s play/jk2/qagame.wasm)" -gt 262144
      - name: Image builds from a clean tree
        # The headline promise in the README: a clone plus Docker gives a working site.
        run: DOCKER_BUILDKIT=1 docker build --target runtime -t jk2-web:ci .
      - name: Tidy
        if: always()
        # Root-owned by the toolchain container, so remove it the same way.
        run: docker run --rm -v "$PWD":/w -w /w alpine:3 rm -rf build-jk2

  hygiene:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, ovh, virtastic]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: No game data tracked
        run: |
          if git ls-files | grep -E '\.(pk3|sav)$'; then
            echo "FATAL: game data is tracked"; exit 1
          fi
          echo "ok: no .pk3/.sav tracked"
      - name: No internal infrastructure detail
        run: |
          # games/ is Raven's pristine drop and the engineering log quotes historical sessions
          # verbatim; this file necessarily contains the patterns it searches for.
          if git grep -nI -E '192\.168\.[0-9]+\.[0-9]+|jenkins_home/\.ssh/(id_ed25519|jk2-deploy)' -- . ':!games/' ':!docs/WASM_ADAPTATIONS.md' ':!.github/workflows/ci.yml'; then
            echo "FATAL: internal infrastructure reference reintroduced"; exit 1
          fi
          echo "ok: no lab hosts or key paths"
